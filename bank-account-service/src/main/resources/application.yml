server:
  port: ${BAS_PORT:8081}
  servlet:
    context-path: /account-service

spring:
  application:
    name: bank-account-service
  datasource:
    url: jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1444};database=bank-account-service;encrypt=true;trustServerCertificate=true;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: ${MSSQL_SA_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
