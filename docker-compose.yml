name: bank-carv

services:
  bank-carv-db:
    container_name: bank-carv-db
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD:
      MSSQL_PID: Developer
    ports:
      - "1444:1433"
    volumes:
      - bank-carv-db-data:/var/opt/mssql
    restart: always
    networks:
      - bank-carv-network
    cap_add:
      - NET_ADMIN

volumes:
  bank-carv-db-data:
    name: bank-carv-db-data

networks:
  bank-carv-network:
    name: bank-carv-network
