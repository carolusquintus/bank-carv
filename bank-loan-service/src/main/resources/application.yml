server:
  port: 8083
  servlet:
    context-path: /loan-service

spring:
  application:
    name: bank-loan-service
  datasource:
    url: jdbc:sqlserver://localhost:1444;database=bank-loan-service;encrypt=true;trustServerCertificate=true;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
